<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Me compras la pala?</title>
<style>
  :root {
    --verde: #c6ff00;
    --verde-oscuro: #8bc400;
    --rosa: #ff2e92;
    --morado: #7b2ff7;
    --fondo-1: #0f2027;
    --fondo-2: #203a43;
    --fondo-3: #2c5364;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }

  body {
    background: linear-gradient(-45deg, var(--morado), var(--fondo-1), var(--rosa), var(--fondo-2), var(--verde-oscuro), var(--fondo-3));
    background-size: 400% 400%;
    animation: fondoAnimado 16s ease infinite;
  }

  @keyframes fondoAnimado {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .decoraciones {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .decoraciones span {
    position: absolute;
    font-size: 2.4rem;
    opacity: 0.35;
    animation: flotar 7s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.25));
  }

  @keyframes flotar {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-40px) rotate(20deg); }
  }

  .card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 28px;
    padding: 40px 28px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 25px 60px rgba(0, 0, 0, 0.45), 0 0 60px rgba(198, 255, 0, 0.15);
    z-index: 1;
    animation: aparecer 0.5s ease;
  }

  @keyframes aparecer {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .hidden { display: none !important; }

  h1 {
    font-size: 1.8rem;
    margin: 0 0 14px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .racket-name {
    font-size: 1.05rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--verde), #8ef0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0 0 30px;
    line-height: 1.4;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  button {
    font-size: 1.15rem;
    font-weight: 700;
    padding: 15px 34px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }

  #yes {
    background: linear-gradient(135deg, var(--verde), #6fe7a8);
    color: #0c2b0c;
    box-shadow: 0 8px 24px rgba(198, 255, 0, 0.45);
  }

  #yes:hover { transform: scale(1.06); box-shadow: 0 10px 30px rgba(198, 255, 0, 0.6); }

  #no {
    background: linear-gradient(135deg, #ff4b5c, var(--rosa));
    color: #fff;
    box-shadow: 0 8px 24px rgba(255, 46, 146, 0.4);
  }

  #no.dodging {
    position: fixed;
    z-index: 1000;
    transition: left 0.18s ease, top 0.18s ease, transform 0.18s ease;
  }

  .success {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 480px;
    text-align: center;
    z-index: 1;
  }

  .success h2 {
    font-size: 2rem;
    line-height: 1.5;
    text-shadow: 0 4px 24px rgba(0,0,0,0.5);
    background: linear-gradient(90deg, #fff, var(--verde), #fff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .pala-foto {
    margin-top: 24px;
    width: 220px;
    max-width: 60%;
    border-radius: 20px;
    background: #fff;
    padding: 10px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 50px rgba(198, 255, 0, 0.25);
    animation: aparecer 0.6s ease;
  }

  .emoji {
    font-size: 3rem;
    margin-bottom: 10px;
    animation: celebrar 0.6s ease infinite alternate;
  }

  @keyframes celebrar {
    from { transform: scale(1) rotate(-4deg); }
    to   { transform: scale(1.15) rotate(4deg); }
  }
</style>
</head>
<body>

  <div class="decoraciones" aria-hidden="true">
    <span style="top:8%; left:10%; animation-delay:0s;">🎾</span>
    <span style="top:15%; left:80%; animation-delay:1.2s; font-size:2rem;">🏆</span>
    <span style="top:70%; left:6%; animation-delay:2.1s; font-size:2rem;">🎉</span>
    <span style="top:80%; left:85%; animation-delay:0.6s;">🎾</span>
    <span style="top:40%; left:92%; animation-delay:1.8s; font-size:1.8rem;">✨</span>
    <span style="top:30%; left:4%; animation-delay:0.9s; font-size:1.8rem;">✨</span>
    <span style="top:85%; left:45%; animation-delay:1.5s; font-size:2rem;">🎾</span>
  </div>

  <div class="card" id="card">
    <h1>🎾 ¿Me compras la pala? 🎾</h1>
    <p class="racket-name">NOX AT10 Genius 12K Alum Xtrem 2026 by Agustín Tapia</p>
    <div class="buttons">
      <button id="yes" type="button">Sí</button>
      <button id="no" type="button">No</button>
    </div>
  </div>

  <div class="success hidden" id="success">
    <div class="emoji">🎉🏆🎊🥳🎾</div>
    <h2>¡Felicidades, eres el padre del año!</h2>
    <img class="pala-foto" src="pala.webp" alt="NOX AT10 Genius 12K Alum Xtrem 2026 by Agustín Tapia">
  </div>

<script>
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const card = document.getElementById('card');
  const success = document.getElementById('success');

  // Scale decays toward FLOOR forever: 10% smaller on every dodge, with
  // no limit on how many times it can happen. It only approaches FLOOR
  // asymptotically, so it keeps shrinking infinitely but never reaches
  // zero (never actually disappears).
  const FLOOR = 0.12;
  let dodges = 0;

  function dodge() {
    // .card uses `transform` for centering, which turns it into the
    // containing block for fixed-position descendants. Move the button
    // to <body> first so its fixed coordinates are relative to the
    // viewport, not the card.
    if (noBtn.parentNode !== document.body) {
      const rect = noBtn.getBoundingClientRect();
      document.body.appendChild(noBtn);
      noBtn.style.left = rect.left + 'px';
      noBtn.style.top = rect.top + 'px';
    }

    dodges++;
    const scale = FLOOR + (1 - FLOOR) * Math.pow(0.90, dodges);
    noBtn.classList.add('dodging');

    const w = noBtn.offsetWidth * scale;
    const h = noBtn.offsetHeight * scale;
    const maxX = Math.max(0, window.innerWidth - w);
    const maxY = Math.max(0, window.innerHeight - h);

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noBtn.style.transform = `scale(${scale})`;
  }

  // Only reacts to an actual click/tap, not to the cursor hovering
  // or approaching it.
  noBtn.addEventListener('click', (e) => {
    e.preventDefault();
    dodge();
  });

  yesBtn.addEventListener('click', () => {
    card.classList.add('hidden');
    noBtn.classList.add('hidden');
    success.classList.remove('hidden');
  });
</script>

</body>
</html>
